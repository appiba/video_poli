<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ec0a78">

  <title>Sorpréndeme</title>

  <style>

    :root{
      --rosa: #ec0a78;
      --rosa-fuerte: #d90068;
      --rosa-claro: #ff4fa3;
      --blanco: #ffffff;
      --negro: #000000;
    }

    *{
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body{
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: var(--rosa);

      overflow: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    body{
      position: fixed;
      inset: 0;
    }

    .app{
      position: relative;

      width: 100vw;
      height: 100vh;
      height: 100dvh;

      overflow: hidden;

      background: var(--rosa);

      display: flex;
      justify-content: center;
      align-items: center;
    }

    video{
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      background: var(--rosa);

      border: none;
      outline: none;
    }

    .overlay{
      position: absolute;

      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.02) 0%,
          rgba(0,0,0,0.00) 55%,
          rgba(0,0,0,0.45) 100%
        );

      z-index: 2;
    }

    .bottom{
      position: absolute;

      left: 0;
      right: 0;

      bottom:
        max(
          22px,
          env(safe-area-inset-bottom)
        );

      padding:
        0 20px
        calc(4px + env(safe-area-inset-bottom));

      display: flex;
      justify-content: center;

      z-index: 5;
    }

    #changeButton{
      width: min(92%, 430px);

      border: 2px solid rgba(255,255,255,0.85);

      border-radius: 999px;

      padding: 17px 24px;

      background: var(--rosa);

      color: var(--blanco);

      font-size: 16px;

      font-weight: 900;

      letter-spacing: .6px;

      cursor: pointer;

      box-shadow:
        0 10px 30px rgba(0,0,0,.30);

      transition:
        transform .15s ease,
        background .15s ease;
    }

    #changeButton:active{
      transform: scale(.96);

      background: var(--rosa-fuerte);
    }

    .loading{
      position: absolute;

      inset: 0;

      z-index: 20;

      background: var(--rosa);

      display: flex;

      flex-direction: column;

      justify-content: center;
      align-items: center;

      gap: 18px;

      color: white;

      transition: opacity .35s ease;
    }

    .loading.hide{
      opacity: 0;

      pointer-events: none;
    }

    .logoText{
      font-size: 34px;

      font-weight: 900;

      letter-spacing: 1px;

      font-style: italic;

      color: white;

      text-shadow:
        0 4px 12px rgba(0,0,0,.18);
    }

    .line{
      width: 190px;

      height: 7px;

      border-radius: 999px;

      background: #ffd400;

      transform: rotate(-3deg);

      margin-top: -8px;
    }

    .spinner{
      width: 36px;
      height: 36px;

      border-radius: 50%;

      border:
        4px solid
        rgba(255,255,255,.30);

      border-top-color: white;

      animation:
        girar .8s linear infinite;
    }

    @keyframes girar{
      to{
        transform: rotate(360deg);
      }
    }

    .error{
      position: absolute;

      inset: 0;

      z-index: 30;

      padding: 30px;

      display: none;

      justify-content: center;
      align-items: center;

      text-align: center;

      color: white;

      background: var(--rosa);

      font-weight: 700;

      font-size: 17px;
    }

  </style>
</head>

<body>

  <div class="app">

    <video
      id="video"
      autoplay
      muted
      playsinline
      webkit-playsinline
      preload="auto"
    ></video>

    <div class="overlay"></div>

    <div class="bottom">
      <button id="changeButton">
        SORPRÉNDEME OTRA VEZ
      </button>
    </div>

    <div id="loading" class="loading">

      <div class="logoText">
        SORPRÉNDEME
      </div>

      <div class="line"></div>

      <div class="spinner"></div>

    </div>

    <div id="error" class="error">
      No se pudo cargar el video.
    </div>

  </div>


  <script>

    const videos = [

      "IMG_6293.MP4",

      "WhatsApp Video 2026-09-04 at 12.48.37.mp4",

      "WhatsApp Video 2026-09-04 at 12.48.57.mp4"

    ];


    const video =
      document.getElementById("video");

    const changeButton =
      document.getElementById("changeButton");

    const loading =
      document.getElementById("loading");

    const error =
      document.getElementById("error");


    let currentIndex = -1;

    let userInteracted = false;


    function getRandomIndex(){

      if(videos.length <= 1){
        return 0;
      }

      let newIndex;

      do{

        newIndex =
          Math.floor(
            Math.random() * videos.length
          );

      }while(newIndex === currentIndex);

      return newIndex;
    }


    async function playSelectedVideo(){

      loading.classList.remove("hide");

      error.style.display = "none";

      currentIndex =
        getRandomIndex();

      const selected =
        videos[currentIndex];

      video.pause();

      video.src =
        encodeURI(selected);

      video.load();


      try{

        if(userInteracted){

          video.muted = false;

        }else{

          video.muted = true;

        }

        await video.play();

      }catch(err){

        console.log(
          "Autoplay restringido:",
          err
        );

        /*
          Segundo intento obligatorio
          en silencio para móviles.
        */

        try{

          video.muted = true;

          await video.play();

        }catch(error2){

          console.log(
            "Segundo intento falló:",
            error2
          );

        }

      }

    }


    video.addEventListener(
      "playing",
      () => {

        setTimeout(
          () => {

            loading.classList.add("hide");

          },
          250
        );

      }
    );


    video.addEventListener(
      "canplay",
      () => {

        loading.classList.add("hide");

      }
    );


    video.addEventListener(
      "waiting",
      () => {

        loading.classList.remove("hide");

      }
    );


    video.addEventListener(
      "error",
      () => {

        loading.classList.add("hide");

        error.style.display = "flex";

        console.log(
          "Error video:",
          video.error
        );

      }
    );


    changeButton.addEventListener(
      "click",
      async () => {

        userInteracted = true;

        await playSelectedVideo();

        video.muted = false;

      }
    );


    /*
      Primera carga automática
    */

    playSelectedVideo();


    /*
      Si la persona toca cualquier parte
      de la pantalla, activamos el audio
      inmediatamente.
    */

    document.addEventListener(
      "pointerdown",
      () => {

        if(!userInteracted){

          userInteracted = true;

          video.muted = false;

        }

      },
      {
        once: true
      }
    );


  </script>

</body>
</html>
